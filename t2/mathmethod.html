<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Methods</title>
    <script>
        document.writeln(Math.E);

        var a = Math.pow(2, 3);

        document.writeln(a);

        var num = Math.random();

        document.writeln(num);

        var num2 = parseInt(1 + (Math.random() * 100));

        document.writeln(num2);

        document.write(Math.ceil(2.7));

        document.write(Math.floor(2.7));

        document.write(Math.round(2.7));
    </script>
</head>

<body>

</body>

</html>
