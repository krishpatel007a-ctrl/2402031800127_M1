# Gray Grid Layout with Circle Animation ```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gray Grid Layout</title>

    <style>
    * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: #1f2937;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 90%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 100px 250px 100px;
            gap: 15px;
        }
        
        .box {
            background: #374151;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        .header {
            grid-column: 1 / 4;
            background: #4b5563;
        }
        
        .home {
            background: #6b7280;
        }
        
        .content {
            position: relative;
            overflow: hidden;
            background: #111827;
        }
        
        .cs {
            background: #6b7280;
        }
        
        .footer {
            grid-column: 1 / 4;
            background: #4b5563;
        }
        
        100% {
            transform: rotate(360deg);
        }
    }
    @media(max-width: 768px) {
        .container {
            grid-template-columns: 1fr;
            grid-template-rows: auto;
        }
        
        .header,
        .footer {
            grid-column: 1;
        }
    }
    </style>
</head>

<body>

    <div class="container">

        <div class="box header">HTML</div>

        <div class="box home">HOME</div>

        <div class="box content">CONTENT</div>

        <div class="box cs">CSS</div>

        <div class="box cs">CSS</div>

        <div class="box footer">FOOTER</div>

    </div>

</body>

</html>
