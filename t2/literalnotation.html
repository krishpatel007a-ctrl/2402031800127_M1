<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Object Literal Notation</h1>
    <script>
        let person = {
            firstName: "Krish",
            lastName: "Patel",

            sayHey: function() {
                alert("Hey! " + this.firstName + " " + this.lastName);
            }
        };

        person.sayHey();
    </script>

</body>

</html>
