<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of CSS Boxes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 20px;
        }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .box {
            width: 220px;
            height: 120px;
            padding: 20px;
            border: 5px solid black;
            color: white;
            text-align: center;
            font-size: 20px;
        }
        
        .fixed-box {
            background-color: blue;
            position: fixed;
            top: 20px;
            right: 20px;
        }
        
        .relative-box {
            background-color: green;
            position: relative;
            left: 30px;
            top: 20px;
        }
        
        .absolute-container {
            position: relative;
            height: 200px;
            border: 2px dashed gray;
            margin-top: 50px;
        }
        
        .absolute-box {
            background-color: red;
            position: absolute;
            top: 30px;
            left: 40px;
        }
        
        .sticky-box {
            background-color: purple;
            position: sticky;
            top: 10px;
        }
        
        .space {
            height: 800px;
        }
    </style>
</head>

<body>

    <h1>4 Types of CSS Boxes</h1>

    <div class="box fixed-box">
        Fixed Box
    </div>

    <div class="container">

        <div class="box relative-box">
            Relative Box
        </div>

        <div class="box sticky-box">
            Sticky Box
        </div>

    </div>

    <div class="absolute-container">
        <div class="box absolute-box">
            Absolute Box
        </div>
    </div>

    <div class="space"></div>

</body>

</html>
