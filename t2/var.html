<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>HEY GUYS JS HERE</h2>
    <P>example for a,b and c variables</P>

    <p id="demo"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <p id="demo4"></p>
    <script>
        var a = 7;

        var b = 6;

        var c = a * b;

        var d = a / b;

        var e = a + b;

        var f = a - b;

        document.getElementById("demo").innerHTML = "value of c is: " + c;
        document.getElementById("demo2").innerHTML = "value of d is: " + d;
        document.getElementById("demo3").innerHTML = "value of e is: " + e;
        document.getElementById("demo4").innerHTML = "value of f is: " + f;
    </script>


</body>

</html>
