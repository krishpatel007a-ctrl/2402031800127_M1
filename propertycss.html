<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Layout Example</title>

    <style>
        /* A */
        
        #division1 {
            background-color: blue;
            /* B */
            float: left;
            /* C */
            width: 50%;
            /* D */
            height: 200px;
            color: white;
            text-align: center;
            line-height: 200px;
            font-size: 30px;
        }
        /* W */
        
        #division2 {
            background-color: red;
            /* X */
            float: left;
            /* Y */
            width: 50%;
            height: 200px;
            color: white;
            text-align: center;
            line-height: 200px;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <div id="division1">
        ABCD
    </div>

    <div id="division2">
        WAXY
    </div>

</body>

</html>
