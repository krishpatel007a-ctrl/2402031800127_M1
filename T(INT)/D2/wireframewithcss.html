<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS WIREFRAME</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }
        
        .container {
            width: 700px;
            margin: 20px auto;
            background-color: lightgray;
        }
        
        .box {
            border: 2px solid black;
            text-align: center;
            padding: 20px;
            margin-bottom: 10px;
        }
        
        .header {
            background-color: black;
            color: white;
        }
        
        .box:nth-child(2) {
            background-color: gray;
            color: white;
        }
        
        .box:nth-child(3) {
            height: 200px;
            line-height: 200px;
            background-color: blue;
            color: white;
        }
        
        .footer {
            background-color: black;
            color: white;
        }
    </style>

</head>

<body>
    <h1>WIRE FRAME WITH CSS:- </h1>
    <div class="container">

        <div class="box header">
            <h2>HEADER</h2>
        </div>

        <div class="box">
            HOME | ABOUT | SERVICES | CONTACT
        </div>

        <div class="box content">
            MAIN CONTENT
        </div>

        <div class="box">
            FOOTER
        </div>

    </div>
    <hr>
</body>

</html>
