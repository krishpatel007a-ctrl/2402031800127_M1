<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE WEB PAGE</title>

    <style>
        html {
            scroll-behavior: smooth;
        }
        
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: white;
            background-color: #111;
        }
        
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(30, 30, 30, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px 0;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        
        .nav-logo {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #f39c12;
        }
        
        .nav-links a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
        }
        
        .nav-links a:hover {
            color: #f39c12;
            transform: translateY(-2px);
        }
        
        section {
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 100px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }
        
        section * {
            position: relative;
            z-index: 2;
        }
        
        h1,
        h2 {
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
        }
        
        h1 {
            font-size: 3rem;
        }
        
        h2 {
            font-size: 2.5rem;
        }
        
        p {
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            margin-bottom: 25px;
        }
        
        #about img {
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 100%;
            height: auto;
            transition: transform 0.3s ease;
        }
        
        #about img:hover {
            transform: scale(1.02);
        }
        
        button {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
            transition: all 0.3s ease;
        }
        
        button:hover {
            background-color: #e67e22;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.6);
        }
        
        #home {
            background-image: url('P1.jpeg');
            background-size: cover;
            background-position: center;
        }
        
        #about {
            background-image: url('P3.jpeg');
            background-size: cover;
            background-position: center;
        }
        
        #services {
            background-image: url('P3.jpeg');
            background-size: cover;
            background-position: center;
        }
        
        #contact {
            background-image: url('P1.jpeg');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>

<body>

    <nav>
        <h1 class="nav-logo">HEY THERE</h1>
        <div class="nav-links">
            <a href="#home">Home 🏠</a>
            <a href="#about">About 🤔</a>
            <a href="#services">Services 🧑‍💻</a>
            <a href="#contact">Contact 📞</a>
        </div>
    </nav>

    <section id="home">
        <h1>WELCOME TO FIRST PAGE!</h1>
        <p>THIS IS HOME PAGE.</p>
    </section>

    <section id="about">
        <h2>ABOUT ME</h2>
        <p>MY NAME IS KRISH PATEL. I'M CURRENTLY A B.TECH CSE STUDENT.</p>
        <img src="P3.jpeg" alt="A photo of me" width="400">
    </section>

    <section id="services">
        <h2>WHAT I DO</h2>
        <p>Learning HTML AND CSS nowadays to build beautiful web experiences.</p>
        <button onclick="showAlert()">MORE</button>
        <script>
            function showAlert() {
                alert('THANK YOU FOR VISITING!');
            }
        </script>
    </section>

    <section id="contact">
        <h2>CONTACT ME</h2>
        <p>krishpatel123@gmail.com</p>
    </section>

</body>

</html>
