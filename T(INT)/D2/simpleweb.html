<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Single Page Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 10;
        }
        
        .navbar .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        
        .nav-links {
            list-style: none;
            display: flex;
        }
        
        .nav-links li {
            margin-left: 25px;
        }
        
        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .nav-links a:hover {
            color: white;
        }
        
        .hero {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('p3.jpeg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }
        
        .hero-content {
            max-width: 800px;
            color: white;
        }
        
        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        
        .divider {
            width: 60px;
            height: 3px;
            background-color: #f4623a;
            border: none;
            margin: 0 auto 20px auto;
        }
        
        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }
        
        .btn {
            background-color: #f4623a;
            color: white;
            padding: 15px 35px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            display: inline-block;
            transition: background-color 0.3s ease;
        }
        
        .btn:hover {
            background-color: #d94b25;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">NEW IDEA💡</div>
        <ul class="nav-links">
            <li><a href="#">About🤔</a></li>
            <li><a href="#">Services🧑‍💻</a></li>
            <li><a href="#">Portfolio🎨</a></li>
            <li><a href="#">Contact📞</a></li>
        </ul>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>HEY THERE!</h1>
            <hr class="divider">
            <p>i make my first web page with HTML and CSS!</p>
            <a href="#" class="btn">THANK YOU!</a>
        </div>
    </header>
</body>

</html>
