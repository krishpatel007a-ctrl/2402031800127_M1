<!DOCTYPE html>
<html>

<head>
    <title>My First Web Page</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f2f2f2;
        }
        
        header {
            background: blue;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        nav {
            background: black;
            padding: 10px;
            text-align: center;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }
        
        section {
            padding: 20px;
        }
        
        img {
            width: 300px;
            height: 200px;
        }
        
        button {
            background: blue;
            color: white;
            padding: 10px 20px;
            border: none;
        }
        
        footer {
            background: black;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>

</head>

<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <section>
        <h2>Welcome</h2>

        <p>
            This is a simple webpage created using HTML and CSS.
        </p>

        <img src="P1.jpeg" alt="Image">

        <br><br>

        <button>Click Here</button>
    </section>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>

</html>
