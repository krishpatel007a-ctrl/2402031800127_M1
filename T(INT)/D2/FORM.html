<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body {
            font-family: bold background-color: lightgray;
        }
        
        .container {
            width: 350px;
            margin: 50px auto;
            background-color: white;
            padding: 20px;
            border: 1px solid black;
        }
        
        h2 {
            text-align: center;
        }
        
        input,
        select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        button:hover {
            background-color: darkgreen;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Registration Form</h2>

        <form>

            <label>Full Name</label><br>
            <input type="text" placeholder="Enter your name">

            <label>Email</label><br>
            <input type="email" placeholder="Enter your email">

            <label>Password</label><br>
            <input type="password" placeholder="Enter password" pattern="(?=.*[a-zA-Z])(?=.*[!@#$%^&*]).{6}" title="Must be exactly 6 characters, including at least one letter and one special character (!@#$%^&*)." required>

            <label>Gender</label><br>
            <select>
                <option>Male</option>
                <option>Female</option>
            </select>
            <br><br>

            <label>Country</label><br>
            <select>
                <option>India</option>
                <option>Australia</option>
            </select>

            <br><br>
            <label>Date of Birth</label>
            <input type="date" onclick="this.showPicker()" required>

            <button type="submit ">Register</button>

        </form>

    </div>

</body>

</html>
