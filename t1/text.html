<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Properties Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        
        .underline {
            text-decoration: underline;
            color: blue;
            font-size: 30px;
        }
        
        .overline {
            text-decoration: overline;
            color: green;
            font-size: 30px;
        }
        
        .none {
            text-decoration: none;
            color: red;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <h1 class="underline">This is Underline Text</h1>

    <h1 class="overline">This is Overline Text</h1>

    <h1 class="none">This is Normal Text</h1>

</body>

</html>
