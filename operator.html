<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Operators Example</title>
</head>

<body>

    <h2>JS TIME</h2>

    <script>
        let a = 10;
        let b = 5;

        document.write("<h3>Arithmetic Operators</h3>");
        document.write("a + b = " + (a + b) + "<br>");
        document.write("a - b = " + (a - b) + "<br>");
        document.write("a * b = " + (a * b) + "<br>");
        document.write("a / b = " + (a / b) + "<br>");
        document.write("a % b = " + (a % b) + "<br><br>");


        let x = 5;

        document.write("<h3>Increment / Decrement Operators</h3>");

        document.write("Initial value of x = " + x + "<br>");
        document.write("Post Increment x++ = " + (x++) + "<br>");
        document.write("Value after Post Increment = " + x + "<br>");

        document.write("Pre Increment ++x = " + (++x) + "<br>");

        document.write("Post Decrement x-- = " + (x--) + "<br>");
        document.write("Value after Post Decrement = " + x + "<br>");

        document.write("Pre Decrement --x = " + (--x) + "<br><br>");


        let p = 10;
        let q = "10";

        document.write("<h3>Comparison Operators</h3>");

        document.write("p == q : " + (p == q) + "<br>");
        document.write("p != q : " + (p != q) + "<br>");
        document.write("p > 5 : " + (p > 5) + "<br>");
        document.write("p >= 10 : " + (p >= 10) + "<br>");
        document.write("p < 20 : " + (p < 20) + "<br>");
        document.write("p <= 10 : " + (p <= 10) + "<br><br>");


        document.write("<h3>Strict Comparison Operators</h3>");

        document.write("p === q : " + (p === q) + "<br>");
        document.write("p !== q : " + (p !== q) + "<br>");
    </script>

</body>

</html>
