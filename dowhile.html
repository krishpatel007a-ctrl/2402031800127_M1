<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do While Loop Programs</title>
</head>

<body>

    <h2>Do While Loop Programs</h2>

    <script>
        // 1. Simple Calculator using Do While Loop

        let choice = 1;

        document.write("<h3>Simple Calculator</h3>");

        do {

            let num1 = 10;
            let num2 = 5;

            switch (choice) {

                case 1:
                    document.write("Addition = " + (num1 + num2) + "<br>");
                    break;

                case 2:
                    document.write("Subtraction = " + (num1 - num2) + "<br>");
                    break;

                case 3:
                    document.write("Multiplication = " + (num1 * num2) + "<br>");
                    break;

                case 4:
                    document.write("Division = " + (num1 / num2) + "<br>");
                    break;
            }

            choice++;

        } while (choice <= 4);



        // 2. ATM Menu Simulation using Do While Loop

        let balance = 5000;
        let atmChoice = 1;

        document.write("<h3>ATM Menu Simulation</h3>");

        do {

            switch (atmChoice) {

                case 1:
                    let deposit = 2000;
                    balance = balance + deposit;

                    document.write("Deposited Amount = " + deposit + "<br>");
                    document.write("Current Balance = " + balance + "<br><br>");
                    break;

                case 2:
                    let withdraw = 1000;

                    if (withdraw <= balance) {

                        balance = balance - withdraw;

                        document.write("Withdraw Amount = " + withdraw + "<br>");
                        document.write("Current Balance = " + balance + "<br><br>");
                    }
                    break;

                case 3:
                    document.write("Balance Check = " + balance + "<br><br>");
                    break;
            }

            atmChoice++;

        } while (atmChoice <= 3);
    </script>

</body>

</html>
